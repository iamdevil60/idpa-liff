<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCSD1 Shooting Team</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#0a0310;--card:#170a20;--line:#3a1a4a;--mag:#c828ff;--mag2:#8e1bc0;--txt:#f3eef7;--sub:#b9a6c6;--ok:#3ddc84;--bad:#ff5c7a;--warn:#ffc94d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1a0526,#2b0a3d);border-bottom:2px solid var(--mag);padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:18px;letter-spacing:.3px}
header .role{margin-left:auto;font-size:12px;background:var(--mag);color:#fff;border-radius:999px;padding:2px 10px}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h2{font-size:20px;margin:8px 0 12px}
h3{font-size:16px;margin:18px 0 8px;color:var(--mag)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
label .req{color:var(--mag)}
input,select{width:100%;background:#0f0616;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--mag);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:420px){.row{grid-template-columns:1fr}}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--mag);color:#fff;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--mag);color:var(--mag)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}
.btn:disabled{opacity:.5}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--mag)}
.consent{max-height:46vh;overflow:auto;font-size:14px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:12px;background:#0f0616}
.consent b{color:var(--txt)}
.check{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px;color:var(--txt);margin:0}
.check:last-child{border-bottom:0}
.check input{width:24px;height:24px;flex:none;accent-color:var(--mag)}
.check small{color:var(--sub);display:block}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;border:1px solid var(--line);color:var(--sub)}
.tag.req{border-color:var(--mag);color:var(--mag)}
.gun{position:relative}
.gun .x{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--bad);font-size:22px;cursor:pointer}
.msg{padding:12px;border-radius:10px;margin-bottom:12px;font-size:15px}
.msg.ok{background:#0f2b1c;color:var(--ok)}.msg.err{background:#2e0c15;color:var(--bad)}.msg.info{background:#22102e;color:var(--sub)}
.center{text-align:center;padding:60px 0;color:var(--sub)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--mag);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tabs a{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--sub);text-decoration:none;font-size:14px}
.tabs a.on{background:var(--mag);border-color:var(--mag);color:#fff}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
th{color:var(--sub);font-weight:600}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.yes{color:var(--ok)}.no{color:var(--bad)}.na{color:#5a4866}
.mem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .info{flex:1;min-width:0}
.mem .info small{color:var(--sub);display:block}
.mem select{width:auto;padding:6px 8px;font-size:14px}
.inactive{opacity:.45}
.itemrow{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.itemrow .tick{width:26px;height:26px;padding:0;accent-color:var(--mag)}
.itemrow .x{background:none;border:0;color:var(--bad);font-size:24px;cursor:pointer}
.muted{color:var(--sub);font-size:13px}
textarea{width:100%;background:#0f0616;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;resize:vertical}
.ev{cursor:pointer}
.evtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.evtitle{display:block;font-size:17px;margin:6px 0 2px}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff}
.badge.match{background:#c8285a}.badge.practice{background:#5a3bd6}
.mine{margin-left:auto;font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--mag);color:var(--mag)}
.mine.going,.mine.confirmed,.mine.registered{background:var(--mag);color:#fff}
.mine.not_going,.mine.cancelled{border-color:var(--line);color:var(--sub)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.seg button{flex:1;min-width:72px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#0f0616;color:var(--sub);font:inherit;cursor:pointer}
.seg button.on{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:700}
.back{display:inline-block;color:var(--mag);margin-bottom:8px;cursor:pointer}
.adm{display:flex;gap:8px;align-items:center}
.adm .sq{width:72px;padding:6px 8px;font-size:14px}
.adm .ck{display:flex;gap:4px;align-items:center;margin:0;color:var(--txt);font-size:14px}
.adm .ck input{width:20px;height:20px;accent-color:var(--mag)}
.datebtn{width:100%;text-align:left;background:#0f0616;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;cursor:pointer}
.datebtn.empty{color:var(--sub)}
.datebtn::after{content:'📅';float:right}
.timesel{display:flex;gap:6px;align-items:center}
.timesel select{width:auto;flex:1}
.dp-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dp{background:var(--card);border:1px solid var(--mag);border-radius:16px;padding:14px;width:100%;max-width:360px}
.dp-h{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.dp-h b{flex:1;text-align:center;font-size:17px}
.dp-h button,.dp-f button{background:#0f0616;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dp-w span{font-size:12px;color:var(--sub)}
.dp-g button{aspect-ratio:1;border:0;border-radius:8px;background:#0f0616;color:var(--txt);font:inherit;cursor:pointer}
.dp-g button.today{outline:1px solid var(--mag)}
.dp-g button.sel{background:var(--mag);color:#fff;font-weight:700}
.dp-f{display:flex;gap:6px;margin-top:10px}
.dp-f button{flex:1}
</style>
</head>
<body>
<header><b id="team">TCSD1 Shooting Team</b><span class="role" id="role" hidden></span></header>
<main id="app"><div class="center"><div class="spin"></div>กำลังโหลด…</div></main>

<script>
// ===== ค่าตั้ง (ไม่ใช่ความลับ) =====
const CONFIG = {
  LIFF_ID: '2012253563-eZxSvmeK',
  API_URL: 'https://script.google.com/macros/s/AKfycbxwvYSnCuRe8LQMQs7MlGxSzsj0Y2K4p7gPoJCmjflJ0KnmpECopycWs1WKioW2kobq/exec',
};
const SHIRT = ['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
const ROLE_TH = {admin:'Admin', treasurer:'เหรัญญิก', member:'สมาชิก'};

let S = {}; // state จาก bootstrap
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, data) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, idToken: liff.getIDToken(), data: data || {}}),
  });
  const j = await res.json();
  if (!j.ok) {
    if (/^AUTH/.test(j.error || '')) { liff.logout(); liff.login({redirectUri: location.href}); }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j.data;
}
function loading(t){ app.innerHTML = `<div class="center"><div class="spin"></div>${esc(t||'กำลังบันทึก…')}</div>`; }
function msg(type, text){ return `<div class="msg ${type}">${esc(text)}</div>`; }
function view(){ return new URLSearchParams(location.search).get('view') || 'profile'; }
function go(v){ history.replaceState(null,'','?view='+v); render(); }
function opt(list, cur, blank){ return (blank?'<option value="">— เลือก —</option>':'') + list.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join(''); }
function closeOrHome(){ if (liff.isInClient()) liff.closeWindow(); else go('profile'); }

async function boot(){
  try {
    await liff.init({liffId: CONFIG.LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
    S = await api('bootstrap');
    $('#team').textContent = S.teamName;
    if (S.role) { $('#role').hidden = false; $('#role').textContent = ROLE_TH[S.role]; }
    render();
  } catch (e) {
    app.innerHTML = msg('err', 'เปิดหน้าไม่สำเร็จ: ' + e.message) + '<button class="btn ghost" onclick="location.reload()">ลองใหม่</button>';
  }
}

function render(){
  const v = view();
  if (v.startsWith('admin') && S.role !== 'admin') { app.innerHTML = msg('err','หน้านี้สำหรับ Admin เท่านั้น'); return; }
  if (!S.role && v !== 'profile') { history.replaceState(null,'','?view=profile'); }
  if (v === 'event-edit' && S.role !== 'admin') { app.innerHTML = msg('err','หน้านี้สำหรับ Admin เท่านั้น'); return; }
  ({profile: renderProfile, equipment: renderEquipmentOnly, 'admin-members': renderAdminMembers,
    'admin-equipment': renderAdminEquipment, 'admin-settings': renderAdminSettings,
    calendar: () => renderCalendar(false), 'calendar-past': () => renderCalendar(true), checkin: renderCheckin,
    event: renderEvent, 'event-edit': renderEventEdit}[view()] || renderProfile)();
  window.scrollTo(0,0);
}

// ===================== สมัคร / ข้อมูลของฉัน =====================
let step = 0;
function steps(n){ return `<div class="steps">${[0,1,2,3].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`; }

function renderProfile(){
  if (!S.role) step = Math.max(step, 0); else if (step === 0) step = 1;
  [renderConsent, renderPersonal, renderFirearms, renderEquipment][step]();
}

function renderConsent(){
  app.innerHTML = `${steps(0)}<h2>ความยินยอมตาม PDPA</h2>
  <div class="card"><div class="consent">
  <p><b>ผู้ควบคุมข้อมูล:</b> หัวหน้าทีม ${esc(S.teamName)} (Admin ของระบบ)</p>
  <p><b>ข้อมูลที่เก็บ:</b> ชื่อ-นามสกุล (ไทย/อังกฤษ) ชื่อเล่น เบอร์โทร ผู้ติดต่อฉุกเฉิน ไซซ์เสื้อ ข้อมูลสมาชิก IDPA (เลขสมาชิก วันหมดอายุ Division Classification) ข้อมูลปืนที่ใช้แข่ง (ยี่ห้อ รุ่น ขนาดกระสุน Power Factor) รายการอุปกรณ์ และ LINE userId</p>
  <p><b>ไม่เก็บ:</b> เลขหรือข้อมูลใบอนุญาตอาวุธปืน (ป.4 / ป.12)</p>
  <p><b>วัตถุประสงค์:</b> บริหารทีมแข่งยิงปืน IDPA ได้แก่ การสมัครแข่ง การเตรียมอุปกรณ์ การนัดซ้อม การเบิกงบสนับสนุน การมอบรางวัล และการติดต่อกรณีฉุกเฉิน</p>
  <p><b>ผู้เข้าถึงข้อมูล:</b> Admin เห็นข้อมูลทั้งหมด เหรัญญิกเห็นเฉพาะข้อมูลการเงิน สมาชิกคนอื่นไม่เห็นข้อมูลติดต่อของคุณ ข้อมูลเก็บใน Google Sheets ส่วนตัวที่ไม่แชร์ให้ผู้อื่น</p>
  <p><b>ระยะเวลาเก็บ:</b> ตลอดที่เป็นสมาชิกทีม เมื่อออกจากทีมหรือถอนความยินยอม ระบบจะลบข้อมูลติดต่อและข้อมูลปืนภายใน 30 วัน โดยเก็บประวัติการเงินและผลการแข่งขันไว้เพื่อการตรวจสอบ</p>
  <p><b>สิทธิ์ของคุณ:</b> ขอดู แก้ไข หรือขอลบข้อมูล และถอนความยินยอมได้ตลอดเวลาที่หน้า “ข้อมูลของฉัน” หรือแจ้ง Admin</p>
  </div>
  <label class="check" style="border:0;margin-top:8px"><input type="checkbox" id="agree"> ข้าพเจ้าอ่านและยินยอมให้เก็บและใช้ข้อมูลตามข้างต้น</label>
  <button class="btn" id="next" disabled>ถัดไป</button></div>`;
  $('#agree').onchange = e => $('#next').disabled = !e.target.checked;
  $('#next').onclick = () => { S.consent = true; step = 1; renderProfile(); };
}

function renderPersonal(){
  const m = S.me || {};
  const f = (k, label, req, type) => `<label>${label}${req?' <span class="req">*</span>':''}</label><input id="f_${k}" type="${type||'text'}" value="${esc(m[k])}" ${req?'required':''}>`;
  app.innerHTML = `${steps(1)}<h2>${S.role?'ข้อมูลของฉัน':'ข้อมูลส่วนตัว'}</h2>
  <div id="m"></div>
  ${tabsMine(0)}
  <div class="card">
    <div class="row"><div>${f('first_name_th','ชื่อ (ไทย)',1)}</div><div>${f('last_name_th','นามสกุล (ไทย)',1)}</div></div>
    <div class="row"><div>${f('first_name_en','ชื่อ (อังกฤษ)')}</div><div>${f('last_name_en','นามสกุล (อังกฤษ)')}</div></div>
    <div class="row"><div>${f('nickname','ชื่อเล่น',1)}</div><div>${f('phone','เบอร์โทร',1,'tel')}</div></div>
    <div class="row"><div>${f('emergency_name','ผู้ติดต่อฉุกเฉิน')}</div><div>${f('emergency_phone','เบอร์ผู้ติดต่อฉุกเฉิน',0,'tel')}</div></div>
    <label>ไซซ์เสื้อ</label><select id="f_shirt_size">${opt(SHIRT, m.shirt_size, 1)}</select>
  </div>
  <div class="card"><h3 style="margin-top:0">IDPA</h3>
    <div class="row"><div>${f('idpa_number','เลขสมาชิก IDPA')}</div><div>${f('idpa_expiry','วันหมดอายุบัตร IDPA',0,'date')}</div></div>
    <div class="row"><div><label>Division หลัก</label><select id="f_division">${opt(S.divisions, m.division, 1)}</select></div>
    <div><label>Classification</label><select id="f_classification">${opt(S.classifications, m.classification, 1)}</select></div></div>
  </div>
  <button class="btn" id="save">${S.role?'บันทึก':'บันทึกและถัดไป'}</button>
  ${S.role?'<button class="btn danger" id="withdraw">ถอนความยินยอม / ออกจากทีม</button>':''}`;
  $('#save').onclick = async () => {
    const data = {consent: true};
    ['first_name_th','last_name_th','first_name_en','last_name_en','nickname','phone','emergency_name','emergency_phone','shirt_size','idpa_number','idpa_expiry','division','classification']
      .forEach(k => data[k] = $('#f_'+k).value.trim());
    if (!data.first_name_th || !data.last_name_th || !data.nickname || !data.phone) { $('#m').innerHTML = msg('err','กรุณากรอกช่องที่มี * ให้ครบ'); scrollTo(0,0); return; }
    const was = S.role; loading();
    try {
      const r = await api('saveProfile', data);
      S.me = r.me; S.role = r.role;
      $('#role').hidden = false; $('#role').textContent = ROLE_TH[S.role];
      S = Object.assign(S, await api('bootstrap'));
      if (!was) { step = 2; renderProfile(); } else { renderPersonal(); $('#m').innerHTML = msg('ok','บันทึกแล้ว'); }
    } catch (e) { renderPersonal(); $('#m').innerHTML = msg('err', e.message); }
  };
  if ($('#withdraw')) $('#withdraw').onclick = async () => {
    if (!confirm('ยืนยันถอนความยินยอมและออกจากทีม?\nระบบจะลบข้อมูลติดต่อและข้อมูลปืนของคุณภายใน 30 วัน')) return;
    loading();
    try { const r = await api('withdrawConsent'); S.role = null; S.me = null; step = 0; $('#role').hidden = true;
      app.innerHTML = msg('ok','ถอนความยินยอมแล้ว ข้อมูลจะถูกลบภายในวันที่ ' + r.deleteAfter) + '<p class="muted">หากต้องการกลับมาเป็นสมาชิก เปิดหน้านี้ใหม่และสมัครได้ทุกเมื่อ</p>';
    } catch (e) { renderPersonal(); $('#m').innerHTML = msg('err', e.message); }
  };
}

let guns = null;
function renderFirearms(){
  if (!guns) guns = (S.firearms || []).map(g => Object.assign({}, g));
  if (!guns.length) guns.push({});
  const card = (g, i) => `<div class="card gun"><button class="x" onclick="guns.splice(${i},1);renderFirearms()" title="ลบ">×</button>
    <h3 style="margin-top:0">กระบอกที่ ${i+1}</h3>
    <div class="row"><div><label>ยี่ห้อ</label><input data-i="${i}" data-k="brand" value="${esc(g.brand)}" placeholder="เช่น Glock"></div>
    <div><label>รุ่น</label><input data-i="${i}" data-k="model" value="${esc(g.model)}" placeholder="เช่น 19 Gen5"></div></div>
    <div class="row"><div><label>ขนาดกระสุน</label><input data-i="${i}" data-k="caliber" value="${esc(g.caliber)}" placeholder="เช่น 9mm"></div>
    <div><label>ใช้ใน Division</label><select data-i="${i}" data-k="division">${opt(S.divisions, g.division, 1)}</select></div></div>
    <div class="row"><div><label>Power Factor ล่าสุด</label><input data-i="${i}" data-k="power_factor" value="${esc(g.power_factor)}" inputmode="decimal"></div>
    <div><label>วันที่วัด Chrono</label><input type="date" data-i="${i}" data-k="chrono_date" value="${esc(g.chrono_date)}"></div></div></div>`;
  app.innerHTML = `${steps(2)}<h2>ปืนที่ใช้แข่ง</h2><div id="m"></div>
  ${tabsMine(1)}
  ${guns.map(card).join('')}
  <button class="btn ghost" onclick="guns.push({});renderFirearms()">+ เพิ่มปืนอีกกระบอก</button>
  <button class="btn" id="save">บันทึก${!(S.firearms||[]).length?'และถัดไป':''}</button>`;
  app.querySelectorAll('[data-k]').forEach(el => el.oninput = el.onchange = e => guns[e.target.dataset.i][e.target.dataset.k] = e.target.value);
  $('#save').onclick = async () => {
    const first = !(S.firearms || []).length;
    loading();
    try { const r = await api('saveFirearms', {firearms: guns}); S.firearms = r.firearms; guns = null;
      S = Object.assign(S, await api('bootstrap'));

// ===================== ปฏิทินแข่ง / ซ้อม (เฟส 2) =====================
const TYPE_TH = {match:'แข่ง', practice:'ซ้อม'};
const LEVEL_TH = {club:'ชมรม', national:'ประเทศ', international:'นานาชาติ'};
const ST_TH = {interested:'สนใจ', registered:'สมัครแล้ว', confirmed:'ยืนยันแล้ว', cancelled:'ยกเลิก', going:'ไป', not_going:'ไม่ไป'};
const MATCH_ST = ['interested','registered','confirmed','cancelled'];
const PRAC_ST = ['going','not_going'];
const qp = k => new URLSearchParams(location.search).get(k) || '';
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
function thd(ymd, withDay){
  if (!ymd) return '';
  const [y,m,d] = ymd.split('-').map(Number); const dt = new Date(y, m-1, d);
  return (withDay ? DAYS[dt.getDay()] + ' ' : '') + d + ' ' + MONTHS[m-1] + ' ' + String(y+543).slice(2);
}
function evDate(e){
  return thd(e.date_start, true) + (e.date_end && e.date_end !== e.date_start ? ' – ' + thd(e.date_end, true) : '') + (e.time_start ? ' · ' + e.time_start + ' น.' : '');
}
function evCount(e){
  const c = e.counts || {};
  return e.type === 'practice' ? `ไป ${c.going||0} คน` : `สนใจ ${c.interested||0} · สมัคร ${c.registered||0} · ยืนยัน ${c.confirmed||0}`;
}
function calTabs(on){
  const t = [['calendar','กำลังจะมาถึง'],['calendar-past','ที่ผ่านมา'],['checkin','เช็คชื่อวันนี้']];
  return `<div class="tabs">${t.map(([v,x])=>`<a class="${v===on?'on':''}" onclick="go('${v}')">${x}</a>`).join('')}</div>`;
}
function evCard(e){
  const cancelled = e.status === 'cancelled';
  return `<div class="card ev ${cancelled?'inactive':''}" onclick="go('event&id=${e.id}')">
    <div class="evtop"><span class="badge ${e.type}">${TYPE_TH[e.type]}</span>${e.level?`<span class="tag">${LEVEL_TH[e.level]}</span>`:''}${cancelled?'<span class="tag" style="color:var(--bad)">ยกเลิก</span>':''}
    ${e.myStatus?`<span class="mine ${e.myStatus}">${ST_TH[e.myStatus]}</span>`:''}</div>
    <b class="evtitle">${esc(e.title)}</b>
    <div class="muted">${esc(evDate(e))}${e.venue?' · '+esc(e.venue):''}</div>
    <div class="muted" style="margin-top:4px">${evCount(e)}${e.myCheckedIn?' · <span class="yes">เช็คชื่อแล้ว ✓</span>':''}</div></div>`;
}

  app.innerHTML = `<h2>ปฏิทินแข่งและซ้อม</h2>${calTabs(past?'calendar-past':'calendar')}<div id="m"></div>

    try { e = Object.assign(e, (await api('getEvent', {id})).event); } catch (err) { app.innerHTML = msg('err', err.message); return; }
  }
  let announce = !id;
  const draw = () => {
    const m = e.type === 'match';
    app.innerHTML = `<a class="back" onclick="go('${id?'event&id='+id:'calendar'}')">‹ กลับ</a><h2>${id?'แก้ไขรายการ':'เพิ่มรายการ'}</h2><div id="m"></div>
    <div class="card">
      <div class="seg">${['practice','match'].map(t=>`<button class="${e.type===t?'on':''}" data-type="${t}">${TYPE_TH[t]}</button>`).join('')}</div>
      <label>ชื่อรายการ <span class="req">*</span></label><input data-k="title" value="${esc(e.title)}" placeholder="${m?'เช่น IDPA Thailand Club Match #5':'เช่น ซ้อมประจำสัปดาห์'}">
      <div class="row"><div><label>วันที่ <span class="req">*</span></label><input type="date" data-k="date_start" value="${esc(e.date_start)}"></div>
      <div><label>เวลา</label><input type="time" data-k="time_start" value="${esc(e.time_start)}"></div></div>
      <label>ถึงวันที่ (ถ้ามีหลายวัน)</label><input type="date" data-k="date_end" value="${esc(e.date_end)}">
      <label>สถานที่</label><input data-k="venue" value="${esc(e.venue)}" placeholder="ชื่อสนาม">
      ${m?`<label>ระดับ</label><select data-k="level">${Object.keys(LEVEL_TH).map(l=>`<option value="${l}" ${e.level===l?'selected':''}>${LEVEL_TH[l]}</option>`).join('')}</select>
      <label>ปิดรับสมัคร</label><input type="date" data-k="registration_deadline" value="${esc(e.registration_deadline)}">
      <label>ลิงก์ PractiScore</label><input data-k="practiscore_url" value="${esc(e.practiscore_url)}" placeholder="https://practiscore.com/...">`:''}
      <label>รายละเอียด</label><textarea data-k="notes" rows="3" placeholder="ค่าสมัคร, จำนวนนัด, สิ่งที่ต้องเตรียม">${esc(e.notes)}</textarea>
      <label class="check" style="border:0;margin-top:10px"><input type="checkbox" id="announce" ${announce?'checked':''}>
        <span>ประกาศเข้ากลุ่ม LINE ทันทีหลังบันทึก<small>มีปุ่มให้สมาชิกกด${m?'สนใจ / สมัครแล้ว':'ไป / ไม่ไป'}ในกลุ่ม · ใช้โควตาเท่าจำนวนคนในกลุ่ม</small></span></label>
    </div><button class="btn" id="save">บันทึก</button>`;
    $('#announce').onchange = ev2 => announce = ev2.target.checked;
    app.querySelectorAll('[data-k]').forEach(i => i.oninput = i.onchange = () => e[i.dataset.k] = i.value);
    app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { e.type = b.dataset.type; draw(); });
    $('#save').onclick = async () => {
      if (!e.title.trim() || !e.date_start) { $('#m').innerHTML = msg('err','กรุณากรอกชื่อรายการและวันที่'); return; }
      $('#save').disabled = true; $('#save').textContent = 'กำลังบันทึก…';
      try {
        const r = await api('saveEvent', {event: Object.assign({}, e, {id}), announce});
        if (r.announced) window.flashMsg = msg('ok','บันทึกและประกาศเข้ากลุ่มแล้ว');
        else if (r.announceError) window.flashMsg = msg('err','บันทึกแล้ว แต่ประกาศเข้ากลุ่มไม่สำเร็จ: ' + r.announceError);
        go('event&id=' + r.id);
      }
      catch (err) { $('#m').innerHTML = msg('err', err.message); $('#save').disabled = false; $('#save').textContent = 'บันทึก'; scrollTo(0,0); }
    };
  };
  draw();
}

// ===================== ตัวเลือกวันที่ / เวลา (แทน input date/time ของเครื่อง) =====================
const pad2 = n => String(n).padStart(2,'0');
const MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function todayYmd(){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fire(el){ el.dispatchEvent(new Event('change', {bubbles:true})); el.dispatchEvent(new Event('input', {bubbles:true})); }

function openDatePicker(input, btn){
  let cur = input.value || todayYmd();
  let [y, m] = cur.split('-').map(Number);
  const ov = document.createElement('div'); ov.className = 'dp-ov';
  const draw = () => {
    const first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate(), t = todayYmd();
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const v = y+'-'+pad2(m)+'-'+pad2(d);
      cells += `<button type="button" data-d="${v}" class="${v===input.value?'sel':''} ${v===t?'today':''}">${d}</button>`;
    }
    ov.innerHTML = `<div class="dp">
      <div class="dp-h"><button type="button" data-nav="-12">«</button><button type="button" data-nav="-1">‹</button>
        <b>${MONTHS_FULL[m-1]} ${y+543}</b>
        <button type="button" data-nav="1">›</button><button type="button" data-nav="12">»</button></div>
      <div class="dp-w">${DAYS.map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="dp-g">${cells}</div>
      <div class="dp-f"><button type="button" data-act="today">วันนี้</button><button type="button" data-act="clear">ล้าง</button><button type="button" data-act="close">ปิด</button></div></div>`;
  };
  const set = v => { input.value = v; btn.textContent = v ? thd(v, true) : 'แตะเพื่อเลือกวันที่'; btn.classList.toggle('empty', !v); fire(input); ov.remove(); };
  ov.onclick = e => {
    const b = e.target.closest('button');
    if (e.target === ov) return ov.remove();
    if (!b) return;
    if (b.dataset.d) return set(b.dataset.d);
    if (b.dataset.nav) { const n = Number(b.dataset.nav); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return draw(); }
    if (b.dataset.act === 'today') return set(todayYmd());
    if (b.dataset.act === 'clear') return set('');
    ov.remove();
  };
  draw(); document.body.appendChild(ov);
}

function enhanceInputs(root){
  root.querySelectorAll('input[type=date]:not([data-enh])').forEach(inp => {
    inp.dataset.enh = '1'; inp.type = 'hidden';
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'datebtn' + (inp.value ? '' : ' empty');
    btn.textContent = inp.value ? thd(inp.value, true) : 'แตะเพื่อเลือกวันที่';
    btn.onclick = () => openDatePicker(inp, btn);
    inp.after(btn);
  });
  root.querySelectorAll('input[type=time]:not([data-enh])').forEach(inp => {
    inp.dataset.enh = '1'; inp.type = 'hidden';
    const [h, mi] = (inp.value || ':').split(':');
    const wrap = document.createElement('div'); wrap.className = 'timesel';
    const hs = document.createElement('select'), ms = document.createElement('select');
    hs.innerHTML = '<option value="">ชั่วโมง</option>' + [...Array(24).keys()].map(x=>`<option ${pad2(x)===h?'selected':''}>${pad2(x)}</option>`).join('');
    ms.innerHTML = ['00','15','30','45'].concat(mi && !['00','15','30','45'].includes(mi) ? [mi] : []).map(x=>`<option ${x===(mi||'00')?'selected':''}>${x}</option>`).join('');
    const upd = () => { inp.value = hs.value ? hs.value + ':' + ms.value : ''; fire(inp); };
    hs.onchange = upd; ms.onchange = upd;
    wrap.append(hs, document.createTextNode(':'), ms, document.createTextNode(' น.'));
    inp.after(wrap);
  });
}
new MutationObserver(() => enhanceInputs(app)).observe(app, {childList: true, subtree: true});

boot();
</script>
